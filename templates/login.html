<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in · Video Saver</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="login-page">
  <main class="login-card card">
    <div class="brand brand-lg">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M16 8v11m0 0-4.5-4.5M16 19l4.5-4.5M10 24h12" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>Video Saver</span>
    </div>

    {% if missing_password %}
      <div class="alert alert-bad" role="alert">
        <p class="alert-title">The app is locked.</p>
        <p>Add a secret named <code>APP_PASSWORD</code> (Replit → Tools → Secrets), then restart the app.</p>
      </div>
    {% else %}
      <p class="muted">This is a private app. Enter the password to continue.</p>
      <form method="post" class="login-form">
        <label for="password" class="field-label">Password</label>
        <input id="password" name="password" type="password" class="text-input"
               autocomplete="current-password" required autofocus>
        {% if error %}<p class="field-error" role="alert">{{ error }}</p>{% endif %}
        <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
